<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Chat • Discord Style</title>
<link rel="icon" href="https://raw.githubusercontent.com/TheWonderlandStudio/Idiot_Box/main/electron/renderer/assets/idot_box.png">
<style>
  * { box-sizing: border-box; }
  * { scrollbar-width: thin; scrollbar-color: #1e1f22 transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #1e1f22; border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: #4e5058; border: 2px solid transparent; background-clip: content-box; }
  :root {
    --bg: #313338;
    --side: #2b2d31;
    --rail: #1e1f22;
    --input: #383a40;
    --text: #dbdee1;
    --muted: #949ba4;
    --blurple: #5865f2;
    --green: #23a55a;
    --hover: #35373c;
    --border: #232428;
  }
  body {
    margin: 0; height: 100vh; height: 100dvh; background: var(--rail); color: var(--text);
    font-family: "gg sans", Whitney, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  /* ---------- LOGIN (discord style) ---------- */
  #login { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: linear-gradient(135deg,#4752c4,#5865f2 45%,#7b5cf0); }
  .card { width: 480px; max-width: 100%; background: #313338; border-radius: 8px; padding: 32px; box-shadow: 0 8px 40px rgba(0,0,0,.4); text-align: center; }
  .card h2 { margin: 0; font-size: 24px; color: #fff; }
  .card p.sub { color: var(--muted); font-size: 14px; margin: 8px 0 20px; }
  .card label { display: block; text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .05em; color: #b5bac1; margin: 12px 0 6px; }
  .card input { width: 100%; padding: 12px; border-radius: 4px; border: none; background: #1e1f22; color: #fff; font-size: 15px; outline: none; }
  .card input:focus { outline: 2px solid var(--blurple); }
  .preview { display: none; align-items: center; gap: 12px; margin-top: 14px; background: #2b2d31; border-radius: 8px; padding: 12px; text-align: left; }
  .preview.show { display: flex; }
  .preview img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: #111; }
  .preview b { color: #fff; font-size: 15px; display: block; }
  .preview span { font-size: 13px; color: var(--muted); }
  #joinBtn { width: 100%; margin-top: 18px; padding: 13px; border: none; border-radius: 4px; background: var(--blurple); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  #joinBtn:hover:not(:disabled) { background: #4752c4; }
  #joinBtn:disabled { opacity: .5; cursor: not-allowed; }
  #loginError { color: #f38688; font-size: 13px; margin-top: 8px; min-height: 18px; }
  #loginStatus { color: var(--muted); font-size: 13px; margin-top: 8px; min-height: 18px; }
  .note { margin-top: 10px; font-size: 12px; color: var(--muted); }

  /* ---------- APP ---------- */
  #app { display: none; height: 100vh; height: 100dvh; grid-template-columns: 72px 240px minmax(0,1fr) 240px; }
  /* server rail */
  #rail { background: var(--rail); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 8px; overflow-y: auto; }
  .srv { width: 48px; height: 48px; border-radius: 50%; background: var(--bg); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; cursor: pointer; transition: .15s; user-select: none; flex-shrink: 0; }
  .srv:hover { border-radius: 16px; background: var(--blurple); }
  .srv.active { border-radius: 16px; background: var(--blurple); }
  .srv.me { background: transparent; padding: 0; overflow: hidden; }
  .srv.me img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .srv.logo { padding: 0; overflow: hidden; }
  .srv.logo img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; display: block; }
  .app-logo { width: 56px; height: 56px; border-radius: 14px; object-fit: cover; margin-bottom: 12px; }
  .sep { width: 32px; height: 2px; background: #35373c; border-radius: 2px; }
  #railHome { position: relative; }
  #railDMs { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  #railDMs:empty { display: none; }
  .srv.dmav { padding: 0; overflow: hidden; position: relative; }
  .srv.dmav img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; display: block; }
  .srv.dmav.active { border-radius: 16px; box-shadow: 0 0 0 2px var(--blurple); }
  #railAdd { background: transparent; border: 2px dashed #4e5058; color: var(--green); font-size: 22px; font-weight: 400; border-radius: 50%; }
  #railAdd:hover { border-radius: 16px; background: var(--green); color: #fff; border-color: var(--green); }
  .bdg { position: absolute; top: -3px; right: -3px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: #f23f43; color: #fff; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2px solid var(--rail); }
  /* channels */
  #channels { background: var(--side); display: flex; flex-direction: column; min-height: 0; }
  #channels .srv-name { padding: 14px 16px; border-bottom: 1px solid var(--border); font-weight: 700; color: #fff; font-size: 15px; display: flex; align-items: center; gap: 6px; }
  #channels .srv-name span { color: var(--green); font-size: 12px; font-weight: 600; }
  .ch-group { padding: 14px 8px; overflow-y: auto; flex: 1; }
  .ch-label { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .05em; padding: 0 8px; margin-bottom: 6px; }
  .ch { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; border: none; background: transparent; color: var(--muted); padding: 7px 8px; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; }
  .ch:hover { background: var(--hover); color: var(--text); }
  .ch.active { background: #404249; color: #fff; }
  .ch .hash { color: #80848e; font-weight: 700; font-size: 16px; }
  .ch.active .hash { color: var(--text); }
  #channels .mebox { background: #232428; padding: 8px; display: flex; align-items: center; gap: 8px; }
  #channels .mebox img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: #111; }
  #channels .mebox .n { font-size: 13px; color: #fff; font-weight: 600; line-height: 1.2; }
  #channels .mebox .s { font-size: 11px; color: var(--green); }
  #channels .mebox button { margin-left: auto; background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 15px; }
  #channels .mebox button:hover { color: #fff; }
  /* chat */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
  #chead { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border); min-height: 52px; }
  #menuBtn { display: none; background: transparent; border: none; color: var(--text); font-size: 19px; cursor: pointer; padding: 4px 8px 4px 0; flex-shrink: 0; }
  #chead .hash { color: #80848e; font-size: 22px; font-weight: 700; flex-shrink: 0; }
  #chead b { color: #fff; font-size: 15px; flex-shrink: 0; }
  #chead .topic { font-size: 12px; color: var(--muted); border-left: 1px solid #3f4147; padding-left: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
  #chead .right { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); flex-shrink: 0; }
  #chead .right button { background: var(--blurple); color: #fff; border: none; border-radius: 4px; padding: 7px 12px; font-weight: 600; cursor: pointer; font-size: 12px; }
  #connInfo { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; cursor: default; }
  .cdot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .cdot.green { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .cdot.yellow { background: #f0b232; }
  .cdot.grey { background: #80848e; }
  #messages { flex: 1; overflow-y: auto; padding: 12px 0 4px; }
  .msg { display: flex; gap: 12px; padding: 6px 16px; }
  .msg:hover { background: #2e3035; }
  .msg img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: #111; cursor: pointer; }
  .msg .body { min-width: 0; }
  .msg .head { display: flex; align-items: baseline; gap: 8px; }
  .msg .head b { color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  .msg .head b:hover { text-decoration: underline; }
  .msg .head .tag { font-size: 11px; color: var(--muted); }
  .msg .head .time { font-size: 11px; color: var(--muted); }
  .msg .txt { font-size: 14px; color: var(--text); line-height: 1.45; word-break: break-word; white-space: pre-wrap; margin-top: 2px; }
  .sys { text-align: center; font-size: 12px; color: var(--muted); padding: 6px; }
  .sys span { background: #2b2d31; padding: 3px 12px; border-radius: 999px; display: inline-block; }
  #typing { min-height: 22px; font-size: 12px; color: var(--text); font-weight: 600; padding: 2px 16px; }
  #typing i { color: var(--muted); font-weight: 400; }
  #inputWrap { padding: 0 16px 16px; }
  #replyBar { display: none; align-items: center; gap: 8px; background: #2b2d31; border-left: 3px solid var(--blurple); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; font-size: 13px; }
  #replyBar.show { display: flex; }
  #replyBar .rt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  #replyBar .rt b { color: #fff; }
  #replyBar button { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 14px; }
  #replyBar button:hover { color: #fff; }
  .msg { position: relative; }
  .msg.flash { background: rgba(88,101,242,.15); }
  .quote { border-left: 3px solid #4e5058; background: #2b2d31; border-radius: 0 6px 6px 0; padding: 6px 10px; margin-bottom: 4px; font-size: 13px; color: var(--muted); cursor: pointer; max-width: 520px; }
  .quote b { color: #c4c9ce; }
  .quote:hover { background: #35373c; }
  .tools { display: none; position: absolute; top: 2px; right: 8px; width: max-content; max-width: calc(100% - 16px); background: #313338; border: 1px solid #232428; border-radius: 8px; padding: 2px 4px; gap: 2px; box-shadow: 0 4px 14px rgba(0,0,0,.4); z-index: 5; }
  .msg:hover .tools, .msg.pin-tools .tools { display: flex; }
  .tools button { background: transparent; border: none; font-size: 15px; padding: 5px 7px; border-radius: 6px; cursor: pointer; color: var(--muted); -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: none; }
  .tools button:hover { background: #404249; transform: scale(1.15); }
  .tools button.holding { background: #4752c4; color: #fff; transform: scale(1.25); }
  .tools button.reply-btn { font-size: 13px; }
  #emojiPicker { display: none; position: fixed; z-index: 100; background: #2b2d31; border: 1px solid #1e1f22; border-radius: 12px; padding: 6px; width: 376px; max-width: calc(100vw - 20px); box-shadow: 0 8px 30px rgba(0,0,0,.6); }
  #emojiPicker.show { display: block; }
  #emojiPicker.super { border-color: #a371f7; box-shadow: 0 8px 30px rgba(163,113,247,.4); }
  #epStatus { font-size: 12px; color: var(--muted); padding: 10px; text-align: center; }
  #epStatus:empty { display: none; }
  emoji-picker { display: block; width: 100%; height: 380px; max-height: 60vh; max-height: 60dvh; }
  /* gif picker */
  #gifPicker { display: none; position: fixed; z-index: 100; background: #2b2d31; border: 1px solid #1e1f22; border-radius: 12px; padding: 10px; width: 360px; max-width: calc(100vw - 20px); box-shadow: 0 8px 30px rgba(0,0,0,.6); }
  #gifPicker.show { display: block; }
  .gif-head { display: flex; gap: 6px; margin-bottom: 8px; }
  .gif-head input { flex: 1; min-width: 0; background: #1e1f22; border: none; border-radius: 6px; color: #fff; padding: 9px 12px; font-size: 13px; outline: none; }
  .gif-head button { background: #383a40; border: none; border-radius: 6px; color: var(--text); padding: 0 11px; font-size: 15px; cursor: pointer; }
  .gif-head button:hover { background: #404249; }
  #gifKeyRow { display: none; gap: 6px; margin-bottom: 8px; }
  #gifKeyRow.show { display: flex; }
  #gifKeyRow input { flex: 1; min-width: 0; background: #1e1f22; border: none; border-radius: 6px; color: #fff; padding: 8px 10px; font-size: 12px; outline: none; }
  #gifKeyRow button { background: var(--blurple); border: none; border-radius: 6px; color: #fff; padding: 0 12px; font-size: 12px; font-weight: 700; cursor: pointer; }
  #gifGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-height: 320px; max-height: 45vh; max-height: 45dvh; overflow-y: auto; }
  .gif-item { background: #1e1f22; border: none; border-radius: 8px; padding: 0; cursor: pointer; overflow: hidden; height: 110px; }
  .gif-item:hover { outline: 2px solid var(--blurple); }
  .gif-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gif-status { grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: 13px; padding: 20px; }
  .gif-setup { grid-column: 1 / -1; font-size: 13px; color: var(--text); padding: 6px 4px; line-height: 1.65; }
  .gif-setup ol { margin: 8px 0 0; padding-left: 20px; color: var(--muted); }
  #inputBox .gif-btn { font-size: 11px; font-weight: 800; letter-spacing: .03em; }
  /* 7tv emotes */
  .chat-emote { height: 28px; vertical-align: middle; cursor: pointer; }
  #epTabs { display: flex; gap: 6px; margin-bottom: 8px; }
  #epTabs button { flex: 1; background: #1e1f22; border: none; border-radius: 6px; color: var(--muted); padding: 7px; font-size: 13px; font-weight: 700; cursor: pointer; }
  #epTabs button.on { background: var(--blurple); color: #fff; }
  #sevenWrap { display: none; }
  #sevenSearch { width: 100%; background: #1e1f22; border: none; border-radius: 6px; color: #fff; padding: 9px 12px; font-size: 13px; outline: none; margin-bottom: 8px; }
  #sevenGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; max-height: 300px; overflow-y: auto; }
  #sevenGrid button { background: transparent; border: none; border-radius: 8px; padding: 6px 8px; cursor: pointer; display: flex; flex-direction: row; align-items: center; justify-content: flex-start; gap: 8px; min-width: 0; }
  #sevenGrid button:hover { background: #404249; }
  #sevenGrid img { height: 30px; width: 30px; object-fit: contain; flex-shrink: 0; }
  #sevenGrid span { font-size: 11px; color: var(--text); text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* in-app profile modal */
  #profileModal { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.6); align-items: center; justify-content: center; padding: 16px; }
  #profileModal.show { display: flex; }
  .pf-card { position: relative; width: 340px; max-width: 100%; background: var(--side); border-radius: 12px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,.6); }
  .pf-banner { height: 90px; background: linear-gradient(135deg,#4752c4,#5865f2 50%,#7b5cf0); }
  #pfAvatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; background: #111; border: 5px solid var(--side); margin: -40px 0 0 16px; display: block; }
  .pf-body { padding: 12px 16px 16px; }
  .pf-name { color: #fff; font-size: 19px; font-weight: 700; }
  .pf-user { font-size: 13px; color: var(--muted); margin-top: 1px; }
  .pf-bio { font-size: 13px; color: var(--text); background: #1e1f22; border-radius: 8px; padding: 10px 12px; margin-top: 10px; line-height: 1.5; }
  .pf-stats { font-size: 11px; color: var(--muted); margin-top: 10px; font-weight: 600; letter-spacing: .03em; }
  .pf-actions { display: flex; gap: 8px; margin-top: 12px; }
  .pf-actions button { flex: 1; padding: 10px; border: none; border-radius: 6px; background: var(--blurple); color: #fff; font-weight: 600; cursor: pointer; font-size: 13px; }
  .pf-actions button:hover { background: #4752c4; }
  .pf-actions button.ghost { background: #383a40; }
  .pf-actions button.ghost:hover { background: #404249; }
  .reacts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .reacts:empty { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 5px; background: #2b2d31; border: 1px solid #4e5058; color: var(--text); border-radius: 8px; padding: 2px 9px; font-size: 13px; cursor: pointer; }
  .chip:hover { border-color: var(--blurple); }
  .chip.mine { background: rgba(88,101,242,.25); border-color: var(--blurple); }
  .chip small { font-size: 12px; font-weight: 700; }
  .chip span { font-size: 15px; line-height: 1; }
  .chip img { border-radius: 0; display: block; }
  .chip.imgchip { background: transparent; border-color: transparent; padding: 2px; gap: 4px; border-radius: 8px; }
  .chip.imgchip:hover { border-color: var(--blurple); }
  .chip.imgchip small { background: #2b2d31; border-radius: 999px; padding: 1px 7px; }
  .chip.super { padding: 4px 12px; background: linear-gradient(135deg, rgba(88,101,242,.35), rgba(163,113,247,.35)); border-color: #a371f7; }
  .chip.super span { font-size: 24px; }
  .chip.super small { font-size: 13px; }
  .msg.is-reply { background: rgba(88,101,242,.06); border-radius: 8px; }
  .msg.is-reply:hover { background: rgba(88,101,242,.1); }
  .msg.nav-sel { outline: 2px solid var(--blurple); outline-offset: -2px; border-radius: 8px; }
  .reply-count { font-size: 11px; color: #8b9bff; cursor: pointer; margin-top: 5px; font-weight: 700; }
  .reply-count:hover { text-decoration: underline; }
  .mention { background: rgba(88,101,242,.3); color: #dee0fc; padding: 1px 5px; border-radius: 4px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .mention:hover { background: var(--blurple); color: #fff; }
  .msg.mentioned { background: rgba(240,178,50,.1); border-left: 2px solid #f0b232; border-radius: 0 8px 8px 0; }
  .msg.mentioned:hover { background: rgba(240,178,50,.16); }
  #inputBox { background: var(--input); border-radius: 8px; display: flex; align-items: center; }
  #inputBox input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: var(--text); font-size: 14px; padding: 13px 14px; }
  #inputBox input::placeholder { color: #6d6f78; }
  #inputBox button { background: var(--blurple); color: #fff; border: none; border-radius: 6px; margin-right: 8px; padding: 8px 14px; font-weight: 600; cursor: pointer; flex-shrink: 0; }
  #inputBox button:hover { background: #4752c4; }
  #inputBox .icon-btn { background: transparent; color: #b5bac1; font-size: 19px; padding: 8px 2px 8px 10px; margin: 0; border-radius: 6px; }
  #inputBox .icon-btn:hover { background: transparent; color: #fff; transform: scale(1.12); }
  #stageBar { display: none; gap: 8px; padding: 0 0 8px; flex-wrap: wrap; }
  #stageBar.show { display: flex; }
  .staged { position: relative; width: 72px; height: 72px; border-radius: 0; overflow: hidden; background: #1e1f22; border: 1px solid #1e1f22; display: flex; align-items: center; justify-content: center; }
  .staged img { width: 100%; height: 100%; object-fit: cover; }
  .staged .sdoc { font-size: 28px; }
  .staged button { position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%; border: none; background: rgba(0,0,0,.7); color: #fff; font-size: 11px; cursor: pointer; line-height: 1; padding: 0; }
  .staged button:hover { background: #ed4245; }
  .attach { margin-top: 6px; max-width: 340px; }
  .attach-img { max-width: 100%; max-height: 260px; border-radius: 0; cursor: pointer; display: block; }
  .msg .attach-img { width: auto; height: auto; border-radius: 0; }
  .file-card { display: flex; align-items: center; gap: 10px; background: #2b2d31; border: 1px solid #1e1f22; border-radius: 8px; padding: 10px 12px; margin-top: 6px; }
  .fic { font-size: 22px; flex-shrink: 0; }
  .fin { flex: 1; min-width: 0; }
  .fnm { font-size: 13px; color: #fff; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fsz { font-size: 11px; color: var(--muted); }
  .fdown { font-size: 12px; background: var(--blurple); color: #fff; border-radius: 6px; padding: 6px 10px; text-decoration: none; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
  .fexp { font-size: 11px; color: var(--muted); flex-shrink: 0; }
  .fprog { height: 5px; background: #1e1f22; border-radius: 99px; margin-top: 6px; overflow: hidden; }
  .fprog i { display: block; height: 100%; background: var(--blurple); width: 0; }
  /* members */
  #members { background: var(--side); overflow-y: auto; padding: 16px 12px; }
  .m-label { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .05em; margin: 4px 8px 8px; }
  .mem { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 4px; cursor: pointer; }
  .mem:hover { background: var(--hover); }
  .mem .av { position: relative; }
  .mem img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: #111; display: block; }
  .mem .st { position: absolute; right: -2px; bottom: -2px; width: 12px; height: 12px; border-radius: 50%; background: var(--green); border: 3px solid var(--side); }
  .mem .n { font-size: 14px; color: #b5bac1; font-weight: 500; }
  .mem.you .n { color: #fff; }
  .mem .u { font-size: 11px; color: var(--muted); }
  /* friends view */
  #friendsView { flex: 1; display: none; flex-direction: column; min-height: 0; min-width: 0; background: var(--bg); }
  /* voice channels + stage + calls */

<script type="module">
import { joinRoom, selfId } from 'https://esm.sh/trystero@0.25.4';

const APP_ID = 'global-gh-chat-v1-2026';
const CHANNELS = [
  { id: 'global', topic: 'Default global chat — sab yahin milte hain' },
  { id: 'introductions', topic: 'Naye log apna intro do' },
  { id: 'chill', topic: 'Random baatein, memes, chill' },
];
const $ = id => document.getElementById(id);

let me = null;
const MAX_FILE = 15 * 1024 * 1024;

// ---------- convo system: channels + DMs, ek hi code path ----------
// Neeche wale globals hamesha VIEWED convo ko mirror karte hain (bindConvo).
// Room event handlers apne convo par handleFor() se chalte hain.
let cur = null;
const convos = new Map();
let viewKey = null;
// dost: friends set + incoming/outgoing requests (localStorage persisted)
let friends = new Set(loadJSON('gh-friends', []));
let reqIn = loadJSON('gh-friend-req', []);
let reqOut = new Set(loadJSON('gh-friend-out', []));
function saveFriends() {
  try {
    localStorage.setItem('gh-friends', JSON.stringify([...friends]));
    localStorage.setItem('gh-friend-req', JSON.stringify(reqIn));
    localStorage.setItem('gh-friend-out', JSON.stringify([...reqOut]));
  } catch {}
}
const isFriend = gh => friends.has(String(gh).toLowerCase());
function isOnline(gh) {
  const low = String(gh).toLowerCase();
  for (const cv of convos.values()) for (const p of cv.peers.values()) {
    if (String(p.gh).toLowerCase() === low) return true;
  }
  return false;
}
function peerIdOf(gh, cv) {
  const low = String(gh).toLowerCase();
  const scope = cv ? [cv] : [...convos.values()].filter(c => c.kind === 'channel');
  let found = null;
  for (const c of scope) for (const [pid, p] of c.peers) {
    if (String(p.gh).toLowerCase() === low) found = pid;
  }
  return found;
}
function updateFriendBadge() {
  const b = $('railBdg');
  if (!b) return;
  if (reqIn.length) {
    b.textContent = reqIn.length > 99 ? '99+' : reqIn.length;
    b.style.display = 'flex';
  } else b.style.display = 'none';
}
function renderFriendsIfVisible() {
  if ($('friendsView').style.display === 'flex') renderFriends($('friendSearch').value || '');
}
function sendFriendReq(gh) {
  if (!me || !gh) return;
  gh = String(gh).replace(/^@/, '');
  const low = gh.toLowerCase();
  if (low === String(me.gh).toLowerCase()) return;
  if (isFriend(gh)) { sysMsg('@' + gh + ' already friend hai ✓'); return; }
  if (reqOut.has(low)) { sysMsg('@' + gh + ' ko request pehle se bheji hai'); return; }
  const gc = convos.get('channel:global');
  const pid = gc ? peerIdOf(gh, gc) : null;
  if (!gc || !gc.room || !gc.acts.friend || !pid) {
    sysMsg('⚠ @' + gh + ' abhi online nahi hai — online aane par try karo');
    return;
  }
  reqOut.add(low); saveFriends();
  try { handleFor(gc, () => { friendAct.send({ kind: 'req', to: gh, from: { gh: me.gh, name: me.name, avatar: me.avatar } }, { target: pid }); }); } catch {}
  sysMsg('@' + gh + ' ko friend request bheji ✓');
  renderFriendsIfVisible();
}
function acceptFriend(gh) {
  const low = String(gh).toLowerCase();
  friends.add(low);
  reqIn = reqIn.filter(r => String(r.gh).toLowerCase() !== low);
  saveFriends(); updateFriendBadge(); renderFriendsIfVisible();
  const gc = convos.get('channel:global');
  const pid = gc ? peerIdOf(gh, gc) : null;
  if (gc && gc.room && gc.acts.friend && pid) {
    try { handleFor(gc, () => { friendAct.send({ kind: 'accept', to: gh, from: { gh: me.gh, name: me.name, avatar: me.avatar } }, { target: pid }); }); } catch {}
  }
  sysMsg('🎉 @' + gh + ' ab tumhara friend hai!');
}
function declineFriend(gh) {
  const low = String(gh).toLowerCase();
  reqIn = reqIn.filter(r => String(r.gh).toLowerCase() !== low);
  saveFriends(); updateFriendBadge(); renderFriendsIfVisible();
  const gc = convos.get('channel:global');
  const pid = gc ? peerIdOf(gh, gc) : null;
  if (gc && gc.room && gc.acts.friend && pid) {
    try { handleFor(gc, () => { friendAct.send({ kind: 'decline', to: gh, from: { gh: me.gh } }, { target: pid }); }); } catch {}
  }
}
// dekhe gaye users (offline list ke liye yaad rakho)
let knownUsers = loadJSON('gh-known-users', {});
let knownSaveT = null;
function rememberUser(u) {
  if (!u || !u.gh) return;
  if (me && String(u.gh).toLowerCase() === String(me.gh).toLowerCase()) return;
  const low = String(u.gh).toLowerCase();
  const prev = knownUsers[low] || {};
  knownUsers[low] = { gh: u.gh, name: u.name || prev.name || u.gh, avatar: u.avatar || prev.avatar || '', lastSeen: Date.now() };
  if (knownSaveT) return;
  knownSaveT = setTimeout(() => {
    knownSaveT = null;
    try { localStorage.setItem('gh-known-users', JSON.stringify(knownUsers)); } catch {}
  }, 4000);
}
let room = null, channelId = 'global';
let chatAct, profileAct, historyAct, typingAct, reactAct, fileAct, dmPingAct, friendAct, dmAckAct, callAct;
let peers = new Map(), typingPeers = new Map();
let cachedMsgs = [], seenIds = new Set(), msgById = new Map();
let reactions = {}, sreactions = {};
let typingTimer = null;
let replyTo = null;
let replyNavId = null;
let staged = [];
let pickerFor = null;
let pickerLoading = null;
let pickerMode = 'react';

function blankStore() { return { msgs: [], seen: new Set(), byId: new Map(), reacts: {}, sreacts: {} }; }
function cacheKeyFor(cv) { return (cv.kind === 'dm' ? 'gh-dm-' : cv.kind === 'vc' ? 'gh-vc-' : cv.kind === 'call' ? 'gh-call-' : 'gh-chat-') + cv.id; }
function reactKeyFor(cv) { return (cv.kind === 'dm' ? 'gh-dreact-' : 'gh-react-') + cv.id; }
function sreactKeyFor(cv) { return (cv.kind === 'dm' ? 'gh-dsreact-' : 'gh-sreact-') + cv.id; }
function loadJSON(k, fb) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? fb : v; } catch { return fb; } }
function ensureConvo(kind, id, extra) {
  const key = kind + ':' + id;
  let cv = convos.get(key);
  if (!cv) {
    cv = {
      kind, id, key,
      roomId: kind === 'dm' ? 'dm-' + id : kind === 'vc' ? 'voice-' + id : kind === 'call' ? 'call-' + id : 'gh-room-' + id,
      store: blankStore(), room: null, acts: {},
      peers: new Map(), typing: new Map(),
      unread: 0, announceTimer: null, lastSeen: new Map(),
      peerGh: kind === 'dm' ? (extra && extra.peerGh) : null,

async function checkGitHub(u) {
  const username = u.replace(/^@/, '').trim();
  if (!/^[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,37}[a-zA-Z0-9])?$/.test(username)) {
    $('loginStatus').textContent = ''; $('loginError').textContent = 'Galat username'; return;
  }
  try {
    const res = await fetch('https://api.github.com/users/' + encodeURIComponent(username));
    if (res.status === 404) { $('loginStatus').textContent = ''; $('loginError').textContent = 'GitHub par nahi mila'; return; }
    if (res.status === 403) { setUser({ gh: username, name: username, avatar: ghPng(username), bio: '' }); $('loginStatus').textContent = ''; return; }
    if (!res.ok) throw 0;
    const j = await res.json();
    setUser({ gh: j.login, name: j.name || j.login, avatar: j.avatar_url || ghPng(j.login), bio: j.bio || '' });
    $('loginStatus').textContent = '';
  } catch {
    $('loginStatus').textContent = '';
    // offline / GitHub down? saved profile se purane messages dekho
    try {
      const saved = JSON.parse(localStorage.getItem('gh-p2p-user') || 'null');
      if (saved && saved.gh && String(saved.gh).toLowerCase() === username.toLowerCase()) {
        setUser(saved);
        $('loginStatus').textContent = 'Offline mode — saved profile, purane messages dikhenge';
        return;
      }
    } catch {}
    $('loginError').textContent = 'Network error';
  }
}

// DM bhejte waqt saamne wala room me nahi to global par ping (offline se wapas aane par kaam aayega)
function pingDMpeer(cv) {
  if (!cv || cv.kind !== 'dm' || !me || !cv.peerGh) return;
  try { if (cv.room && Object.keys(cv.room.getPeers()).length > 0) return; } catch {}
  const gc = convos.get('channel:global');
  if (!gc || !gc.room || !gc.acts.dmPing) return;
  try { handleFor(gc, () => { dmPingAct.send({ to: cv.peerGh, pair: cv.id, from: { gh: me.gh, name: me.name, avatar: me.avatar } }); }); } catch {}
}
function openDM(gh) {
  if (!me || !gh) return;
  gh = String(gh).replace(/^@/, '');
  if (gh.toLowerCase() === String(me.gh).toLowerCase()) return;
  const peer = findProfile(gh);
  const cv = ensureConvo('dm', dmPairKey(me.gh, gh), { peerGh: peer.gh || gh, peer: { gh: peer.gh || gh, name: peer.name || gh, avatar: peer.avatar || '' } });
  ensureRoom(cv);
  // saamne wale ko channel par ping taaki wo bhi DM room join kare
  const gc = convos.get('channel:global');
  if (gc && gc.room && gc.acts.dmPing) {
    try { handleFor(gc, () => { dmPingAct.send({ to: gh, pair: cv.id, from: { gh: me.gh, name: me.name, avatar: me.avatar } }); }); } catch {}
  }
  closeProfile();
  switchConvo(cv);
}

// room join: ek convo ke liye ek baar; rooms switch par bhi joined rehte hain
function ensureRoom(cv) {
  if (cv.room) return;
  const prev = cur;
  bindConvo(cv);
  const room = joinRoom({ appId: APP_ID }, cv.roomId);
  cv.room = room;
  const acts = {
    profile: room.makeAction('profile'),
    chat: room.makeAction('chat'),
    history: room.makeAction('history'),
    typing: room.makeAction('typing'),
    react: room.makeAction('react'),
    file: room.makeAction('file'),
  };
  if (cv.kind === 'channel') { acts.dmPing = room.makeAction('dmping'); acts.friend = room.makeAction('friend'); acts.call = room.makeAction('call'); }
  if (cv.kind === 'dm') acts.dmack = room.makeAction('dmack');
  cv.acts = acts;
  bindConvo(cv);

  profileAct.onMessage = (p, { peerId }) => handleFor(cv, viewedKey => {
    if (!p || !p.gh) return;
    const isNew = !peers.has(peerId);
    peers.set(peerId, { gh: esc(p.gh).slice(0, 39), name: esc(p.name || p.gh).slice(0, 60), avatar: esc(p.avatar || '') });
    cv.lastSeen.set(peerId, Date.now());
    rememberUser({ gh: p.gh, name: p.name || p.gh, avatar: p.avatar || '' });
    if (viewing(cv, viewedKey)) updateUsers();
    if (isNew) {
      if (viewing(cv, viewedKey)) sysMsg('@' + p.gh + (cv.kind === 'dm' ? ' joined the DM' : ' joined the channel'));
      profileAct.send(me, { target: peerId }).catch(() => {});
      const strip = m => (m.file ? { ...m, file: { ...m.file, url: null } } : m);
      const recent = cachedMsgs.slice(-50).map(strip);
      // DM: purane undelivered bhi saath bhejo (offline catch-up)
      if (cv.kind === 'dm') {
        const have = new Set(recent.map(r => r.id));
        cachedMsgs.forEach(m => {
          if (m.gh === (me && me.gh) && !m.delivered && !have.has(m.id)) { recent.push(strip(m)); have.add(m.id); }
        });
      }
      if (recent.length) historyAct.send({ msgs: recent, reacts: reactions, sreacts: sreactions }, { target: peerId }).catch(() => {});
      // channel par naya peer = usko pending DM wala ping (wo offline tha to ab join karega)
      if (cv.kind === 'channel') {
        const low = String(p.gh).toLowerCase();
        convos.forEach(d => {
          if (d.kind !== 'dm' || !d.room) return;
          if (!d.id.split('--').includes(low)) return;
          if (d.store.msgs.some(m => m.gh === (me && me.gh) && !m.delivered)) {
            try { dmPingAct.send({ to: p.gh, pair: d.id, from: { gh: me.gh, name: me.name, avatar: me.avatar } }); } catch {}
          }
        });
      }
    }
    renderVoiceUI();
  });

  const storeMsg = (m) => {
    rememberUser({ gh: m.gh, name: m.name || m.gh, avatar: m.avatar || '' });
    const msg = { id: esc(m.id), gh: esc(m.gh).slice(0, 39), name: esc(m.name || m.gh).slice(0, 60), avatar: esc(m.avatar || ''), text: esc(m.text).slice(0, 1000), ts: Number(m.ts) || Date.now(), reply: m.reply ? { id: esc(m.reply.id || ''), gh: esc(m.reply.gh || ''), name: esc(m.reply.name || '').slice(0, 60), text: esc(m.reply.text || '').slice(0, 200) } : null };
    cachedMsgs.push(msg); msgById.set(msg.id, msg); saveCache();
    return msg;
  };

  chatAct.onMessage = (m, { peerId }) => handleFor(cv, viewedKey => {
    if (!m || !m.id || !m.text || seenIds.has(m.id)) return;
    if (peerId) cv.lastSeen.set(peerId, Date.now());
    seenIds.add(m.id);
    const msg = storeMsg(m);
    if (cv.kind === 'dm') { try { dmAckAct.send({ ids: [m.id] }); } catch {} }
    if (viewing(cv, viewedKey)) renderMessage(msg);
    else if (cv.kind === 'dm') { cv.unread++; renderNav(); }
  });

  historyAct.onMessage = (d) => handleFor(cv, viewedKey => {
    if (!d || !Array.isArray(d.msgs)) return;
    let added = false;
    const addedIds = [];
    d.msgs.forEach(m => {
      if (!m || !m.id || seenIds.has(m.id)) return;
      seenIds.add(m.id);
      addedIds.push(m.id);
      rememberUser({ gh: m.gh, name: m.name || m.gh, avatar: m.avatar || '' });
      cachedMsgs.push({ id: esc(m.id), gh: esc(m.gh), name: esc(m.name), avatar: esc(m.avatar), text: esc(m.text).slice(0, 1000), ts: Number(m.ts) || Date.now(), reply: m.reply || null, file: m.file ? { name: esc(m.file.name || 'file').slice(0, 120), type: esc(m.file.type || ''), size: Number(m.file.size) || 0, url: null } : null });
      added = true;
    });
    const mergeReacts = (target, src) => {
    if (!src || typeof src !== 'object') return false;
    let changed = false;
    Object.entries(src).forEach(([mid, emap]) => {
      if (!target[mid]) target[mid] = {};
      Object.entries(emap).forEach(([e, arr]) => {
        if (!Array.isArray(arr)) return;
        if (!target[mid][e]) target[mid][e] = [];
        arr.forEach(g => { if (!target[mid][e].includes(g)) { target[mid][e].push(g); changed = true; } });
      });
    });
    return changed;
  };
  const rChanged = mergeReacts(reactions, d.reacts);
  const sChanged = mergeReacts(sreactions, d.sreacts);
  if (rChanged) saveReacts();
  if (sChanged) saveSreacts();
  if (!added && !rChanged && !sChanged) return;
    cachedMsgs.forEach(m => msgById.set(m.id, m));
    cachedMsgs.sort((a, b) => a.ts - b.ts);
    saveCache();
    if (cv.kind === 'dm' && addedIds.length) { try { dmAckAct.send({ ids: addedIds }); } catch {} }
    // background DM me history se aaye to unread badge
    if (cv.kind === 'dm' && addedIds.length && !viewing(cv, viewedKey)) { cv.unread += addedIds.length; renderNav(); }
    if (!viewing(cv, viewedKey)) return;
    $('messages').innerHTML = '';
    cachedMsgs.forEach(renderMessage);
  });

  reactAct.onMessage = (d) => handleFor(cv, () => {
    if (!d || !d.msgId || !d.emoji || !d.gh) return;
    const store = d.super ? sreactions : reactions;
    if (!store[d.msgId]) store[d.msgId] = {};
    if (!store[d.msgId][d.emoji]) store[d.msgId][d.emoji] = [];
    const arr = store[d.msgId][d.emoji];
    if (d.on && !arr.includes(d.gh)) arr.push(d.gh);
    if (!d.on) store[d.msgId][d.emoji] = arr.filter(g => g !== d.gh);
    if (!store[d.msgId][d.emoji].length) delete store[d.msgId][d.emoji];
    if (d.super) saveSreacts(); else saveReacts();
    paintReacts(d.msgId);
  });

  if (cv.kind === 'channel' && acts.dmPing) {
    const dmPing = acts.dmPing;    dmPing.onMessage = (d) => {
      if (!d || !d.to || !d.pair || !d.from || !d.from.gh) return;
      if (!me || String(d.to).toLowerCase() !== String(me.gh).toLowerCase()) return;
      const fromGh = String(d.from.gh);
      rememberUser({ gh: fromGh, name: d.from.name || fromGh, avatar: d.from.avatar || '' });
      const dm = ensureConvo('dm', String(d.pair), { peerGh: fromGh, peer: { gh: fromGh, name: d.from.name || fromGh, avatar: d.from.avatar || '' } });
      ensureRoom(dm);
      renderNav();
    };
  }

  if (cv.kind === 'channel' && acts.friend) {
    const fr = acts.friend;
    fr.onMessage = (d) => {
      if (!d || !d.kind || !d.from || !d.from.gh || !me) return;
      const fromGh = String(d.from.gh);
      const low = fromGh.toLowerCase();
      rememberUser({ gh: fromGh, name: d.from.name || fromGh, avatar: d.from.avatar || '' });
      const mine = String(d.to || '').toLowerCase() === String(me.gh).toLowerCase();
      if (d.kind === 'req') {
        if (!mine || isFriend(fromGh)) return;
        if (!reqIn.some(r => String(r.gh).toLowerCase() === low)) {
          reqIn.push({ gh: fromGh, name: d.from.name || fromGh, avatar: d.from.avatar || '', ts: Date.now() });
          saveFriends();
        }
        updateFriendBadge();
        renderFriendsIfVisible();
        if ($('friendsView').style.display !== 'flex') sysMsg('💌 @' + fromGh + ' ne friend request bheji! (💬 Friends dekho)');
      } else if (d.kind === 'accept') {
        if (!mine) return;
        friends.add(low); reqOut.delete(low);
        saveFriends(); updateFriendBadge(); renderFriendsIfVisible();
        sysMsg('🎉 @' + fromGh + ' ne request accept ki — ab dost ho!');
      } else if (d.kind === 'decline') {
        if (!mine) return;
        reqOut.delete(low);
        saveFriends(); renderFriendsIfVisible();
        sysMsg('@' + fromGh + ' ne request decline ki');
      }
    };
  }

  if (cv.kind === 'channel' && acts.call) setupCallSignal(cv, acts.call);

  fileAct.onMessage = (data, { metadata }) => handleFor(cv, viewedKey => {
    const md = metadata || {};
    if (!md.id || seenIds.has(md.id)) return;
    seenIds.add(md.id);
    let url = null;
    try {
      const blob = new Blob([data], { type: md.ftype || 'application/octet-stream' });
      url = URL.createObjectURL(blob);
    } catch {}
    const msg = {
      id: esc(md.id), gh: esc(md.gh || 'unknown').slice(0, 39),
      name: esc(md.name || md.gh || 'unknown').slice(0, 60),
      avatar: esc(md.avatar || ''), text: esc(md.cap || '').slice(0, 1000), ts: Number(md.ts) || Date.now(),
      reply: md.reply ? { id: esc(md.reply.id || ''), gh: esc(md.reply.gh || ''), name: esc(md.reply.name || '').slice(0, 60), text: esc(md.reply.text || '').slice(0, 200) } : null,
      file: { name: esc(md.fname || 'file').slice(0, 120), type: esc(md.ftype || ''), size: Number(md.fsize) || 0, url }
    };
    rememberUser({ gh: md.gh, name: md.name || md.gh, avatar: md.avatar || '' });
    cachedMsgs.push(msg); msgById.set(msg.id, msg); saveCache();
    if (cv.kind === 'dm') { try { dmAckAct.send({ ids: [md.id] }); } catch {} }
    if (viewing(cv, viewedKey)) renderMessage(msg);
    else if (cv.kind === 'dm') { cv.unread++; renderNav(); }
  });

  if (cv.kind === 'dm' && acts.dmack) {
    const da = acts.dmack;
    da.onMessage = (d) => handleFor(cv, () => {
      if (!d || !Array.isArray(d.ids)) return;
      let changed = false;
      d.ids.forEach(id => {
        const m = msgById.get(id);
        if (m && !m.delivered) { m.delivered = true; changed = true; }
      });
      if (changed) saveCache();
    });
  }

  typingAct.onMessage = (d, { peerId }) => handleFor(cv, viewedKey => {
    const p = peers.get(peerId);
    const gh = (d && d.gh) || (p && p.gh) || 'someone';
    if (peerId) cv.lastSeen.set(peerId, Date.now());
    if (d && d.isTyping) {
      typingPeers.set(peerId, gh);
      clearTimeout(typingPeers.get(peerId + ':t'));
      typingPeers.set(peerId + ':t', setTimeout(() => handleFor(cv, () => { typingPeers.delete(peerId); if (viewKey === cv.key) renderTyping(); }), 2500));
    } else typingPeers.delete(peerId);
    if (viewing(cv, viewedKey)) renderTyping();
  });

  room.onPeerJoin = peerId => handleFor(cv, () => { setTimeout(() => handleFor(cv, () => { try { profileAct.send(me, { target: peerId }); } catch {} }), 600); });
  room.onPeerLeave = peerId => handleFor(cv, viewedKey => {
    dropPeer(cv, peerId, viewing(cv, viewedKey));
  });

  setTimeout(() => { try { handleFor(cv, () => { profileAct.send(me); }); } catch {} }, 800);
  cv.announceTimer = setInterval(() => { try { handleFor(cv, () => { profileAct.send(me); }); } catch {} }, 12000);
  if (prev) bindConvo(prev);
}

function appendWithEmotes(box, text) {
  text.split(/(\s+)/).forEach(p => {
    if (!p) return;
    const em = sevenMap[p];
    if (em) {
      const img = document.createElement('img');
      img.className = 'chat-emote'; img.src = em.url; img.alt = p; img.title = p;
      img.onclick = ev => { ev.stopPropagation(); insertSevenCode(p); };
      img.onerror = () => { img.replaceWith(document.createTextNode(p)); };
      box.appendChild(img);
    } else box.appendChild(document.createTextNode(p));
  });
}
function renderRichText(box, text) {
  const re = /(^|[\s>(\[{])@([a-zA-Z0-9](?:[a-zA-Z0-9-]{0,37}[a-zA-Z0-9])?)/g;
  let last = 0, m, hitMe = false;
  while ((m = re.exec(text))) {
    const at = m.index + m[1].length;
    if (at > last) appendWithEmotes(box, text.slice(last, at));
    const gh = m[2];
    const chip = document.createElement('span');
    chip.className = 'mention';
    chip.textContent = '@' + gh;
    chip.title = 'Profile dekho';
    chip.onclick = ev => { ev.stopPropagation(); openProfile(gh); };
    box.appendChild(chip);
    if (me && gh.toLowerCase() === String(me.gh).toLowerCase()) hitMe = true;
    last = at + gh.length + 1;
  }
  if (last < text.length) appendWithEmotes(box, text.slice(last));
  if (!box.hasChildNodes()) box.textContent = text;
  return hitMe;
}

window.toggleReact = function (msgId, emoji) {
  if (!room || !me || !msgId || !emoji) return;
  if (!reactions[msgId]) reactions[msgId] = {};
  if (!reactions[msgId][emoji]) reactions[msgId][emoji] = [];
  const arr = reactions[msgId][emoji];
  const has = arr.includes(me.gh);
  if (has) reactions[msgId][emoji] = arr.filter(g => g !== me.gh);
  else arr.push(me.gh);
  if (!reactions[msgId][emoji].length) delete reactions[msgId][emoji];
  saveReacts();
  paintReacts(msgId);
  try { reactAct.send({ msgId, emoji, gh: me.gh, on: !has }); } catch {}
};

window.toggleSuperReact = function (msgId, emoji) {

// message par long-press (touch) = reaction picker kholo
function bindMsgPress(row, msgId) {
  let timer = null, sx = 0, sy = 0;
  const start = e => {
    if (e.target.closest('button, a, .chip')) return;
    const t = e.touches[0];
    if (!t) return;
    sx = t.clientX; sy = t.clientY;
    if (timer) clearTimeout(timer);
    timer = setTimeout(() => {
      timer = null;
      row.dataset.pressFired = '1';
      try { navigator.vibrate && navigator.vibrate(25); } catch {}
      row.classList.add('pin-tools');
      const rbtn = row.querySelector('.tools button:nth-child(2)');
      togglePicker(msgId, rbtn || row, 'react');
    }, 450);
  };
  const move = e => {
    if (!timer) return;
    const t = e.touches[0];
    if (!t) return;
    if (Math.abs(t.clientX - sx) > 12 || Math.abs(t.clientY - sy) > 12) {
      clearTimeout(timer); timer = null;
    }
  };
  const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
  row.addEventListener('touchstart', start, { passive: true });
  row.addEventListener('touchmove', move, { passive: true });
  row.addEventListener('touchend', cancel);
  row.addEventListener('touchcancel', cancel);
}
// ek hi button: tap = normal react, long-press (450ms) = super react
function bindReactPress(btn, msgId) {
  let timer = null, fired = false, lastTouch = 0;
  const HOLD_MOUSE = 800, HOLD_TOUCH = 450;
  const start = delay => {
    fired = false;
    if (timer) clearTimeout(timer);
    btn.classList.add('holding');
    timer = setTimeout(() => {
      timer = null;
      fired = true;
      btn.classList.remove('holding');
      try { navigator.vibrate && navigator.vibrate(30); } catch {}
      togglePicker(msgId, btn, 'super');
    }, delay);
  };
  const cancel = () => {
    if (timer) { clearTimeout(timer); timer = null; }
    btn.classList.remove('holding');
  };
  // mouse (touch ke nakli mousedown ko ignore karo)
  btn.addEventListener('mousedown', () => { if (Date.now() - lastTouch < 900) return; start(HOLD_MOUSE); });
  // touch (thodi hilan-dulan par cancel mat karo)
  btn.addEventListener('touchstart', () => { lastTouch = Date.now(); start(HOLD_TOUCH); }, { passive: true });
  btn.addEventListener('touchend', () => { lastTouch = Date.now(); cancel(); });
  btn.addEventListener('mouseup', cancel);
  btn.addEventListener('mouseleave', cancel);
  btn.addEventListener('touchcancel', cancel);

function sendCallSignal(gh, payload) {
  const gc = convos.get('channel:global');

  if (voice || callState) { sysMsg('⚠ Pehle current voice/call chhodo'); return; }

    sysMsg('⚠ @' + gh + ' call ke liye online nahi hai');

  const callId = (selfId || 'c').slice(0, 8) + '-' + Date.now().toString(36);
  callState = { callId, peerGh: gh, video: !!video, dir: 'out', peerProfile: findProfile(gh) };
  showCallModal('outgoing');

function tickCall() {

async function joinCallRoom(cs) {

  } catch { sysMsg('⚠ Mic/camera nahi mila'); endCallUI('Mic nahi mila'); return; }
  const cv = ensureConvo('call', cs.callId);

  voice = {
    cv, isCall: true, callId: cs.callId, peerGh: cs.peerGh,
    localStream: stream, remotes: new Map(), analysers: new Map(), speaking: new Map(),
    muted: false, camOn: !!cs.video, sharing: false,

function acceptCall() {

}
function rejectCall() {

}

}

}

  const gh = voice.peerGh;

}
function setupCallSignal(cv, ca) {
  ca.onMessage = (d) => {
    if (!d || !d.kind || !me) return;
    const fromGh = d.from && d.from.gh ? String(d.from.gh) : null;
    if (d.kind === 'offer') {
      if (!fromGh || String(d.to || '').toLowerCase() !== String(me.gh).toLowerCase()) return;
      rememberUser({ gh: fromGh, name: d.from.name || fromGh, avatar: d.from.avatar || '' });
      if (voice || callState) {
        const gc = convos.get('channel:global');
        const pid = gc ? peerIdOf(fromGh, gc) : null;
        if (gc && gc.room && gc.acts.call && pid) {
          try { handleFor(gc, () => { callAct.send({ kind: 'busy', callId: d.callId, to: fromGh, from: { gh: me.gh } }, { target: pid }); }); } catch {}
        }
        return;
      }
      callState = { callId: String(d.callId), peerGh: fromGh, video: !!d.video, dir: 'in', peerProfile: { gh: fromGh, name: (d.from && d.from.name) || fromGh, avatar: (d.from && d.from.avatar) || '' } };
      closeProfile();
      showCallModal('incoming');
      startRing();
    } else if (!callState || String(d.callId || '') !== String(callState.callId)) {
      return;
    } else if (d.kind === 'accept' && callState.dir === 'out') {
      joinCallRoom(callState);
    } else if (d.kind === 'reject' && callState.dir === 'out') {
      endCallUI('📞 @' + callState.peerGh + ' ne call decline ki');
    } else if (d.kind === 'busy' && callState.dir === 'out') {
      endCallUI('📞 @' + callState.peerGh + ' busy hai');
    } else if (d.kind === 'end') {
      if (voice && voice.isCall) remoteHungUp();
      else endCallUI();
    }
  };
}

// poora 7TV catalog search (global set ke bahar bhi)
let sevenQT = null, sevenQToken = null;
async function searchSevenTV(q) {
  q = (q || '').trim();
  if (q.length < 2) return;
  const token = sevenQToken = {};
  try {
    const res = await fetch('https://7tv.io/v3/gql', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        query: 'query($q:String!,$l:Int){emotes(query:$q,limit:$l){items{id name host{url files{name format}}}}}',
        variables: { q, l: 20 },
      }),
    });
    if (!res.ok) throw 0;
    const j = await res.json();
    const items = (((j || {}).data || {}).emotes || {}).items || [];
    if (token !== sevenQToken) return;
    let added = 0;
    items.forEach(e => {
      const host = e.host;
      const files = (host && host.files) || [];
      const f = files.find(x => x.format === 'WEBP') || files.find(x => x.format === 'AVIF') || files.find(x => x.format === 'GIF') || files[0];
      if (!host || !f || !e.name) return;
      if (addEmote('7tv', e.id, e.name, 'https:' + host.url + '/' + f.name)) added++;
    });

  } catch {}
}
async function loadSevenTV() {
  const jobs = [
    // 7TV global: https://7tv.io/v3/emote-sets/global
    (async () => {
      const res = await fetch('https://7tv.io/v3/emote-sets/global');
      if (!res.ok) throw 0;
      const j = await res.json();
      (j.emotes || []).forEach(e => {
        const host = e.data && e.data.host;

        if (!host || !f || !e.name) return;
        addEmote('7tv', e.id, e.name, 'https:' + host.url + '/' + f.name);
      });
    })(),
    // BTTV global: https://api.betterttv.net/3/cached/emotes/global
    (async () => {
      const res = await fetch('https://api.betterttv.net/3/cached/emotes/global');
      if (!res.ok) throw 0;

      (Array.isArray(arr) ? arr : []).forEach(e => {
        if (!e || !e.code || !e.id) return;

  await Promise.allSettled(jobs);
  sevenList.sort((a, b) => a.name.localeCompare(b.name));
  sevenLoaded = true;

  }
  const token = e.provider + ':' + e.id;
  if (pickerMode === 'super' && pickerFor) { toggleSuperReact(pickerFor, token); closePicker(); return; }
  if (pickerFor) toggleReact(pickerFor, token);
  closePicker();
}
function insertSevenCode(name) {
  const inp = $('messageInput');
  inp.value = (inp.value ? inp.value.replace(/\s+$/, '') + ' ' : '') + name + ' ';
  inp.focus();
}
document.querySelectorAll('#epTabs button').forEach(b => {
  b.onclick = ev => {
    ev.stopPropagation();
    const t = b.dataset.t;
    document.querySelectorAll('#epTabs button').forEach(x => x.classList.toggle('on', x === b));
    $('epWrap').style.display = t === 'emoji' ? '' : 'none';
    $('epStatus').style.display = t === 'emoji' ? '' : 'none';
    $('sevenWrap').style.display = t === 'seven' ? 'block' : 'none';
    if (t === 'seven') buildSeven($('sevenSearch').value || '');
  };
});
$('sevenSearch').addEventListener('input', e => {
  const q = e.target.value;
  buildSeven(q);
  clearTimeout(sevenQT);
  sevenQT = setTimeout(() => searchSevenTV(q), 400);
});
loadSevenTV();

function sysMsg(t) {
  const d = document.createElement('div');
  d.className = 'sys';
  const s = document.createElement('span'); s.textContent = t;
  d.appendChild(s);
  $('messages').appendChild(d);
}

function renderTyping() {
  const names = [...typingPeers.entries()].filter(([k]) => !k.endsWith(':t')).map(([, v]) => v);
  $('typing').innerHTML = names.length ? '<b>' + esc(names.slice(0, 3).join(', ')) + '</b> <i>is typing...</i>' : '';
}

function updateUsers() {
  const box = $('memberList');
  box.innerHTML = '';
  if (!me) return;
  if (cur && cur.kind === 'dm') {
    const u = dmProfile(cur);
    const online = [...cur.peers.values()].some(p => String(p.gh).toLowerCase() === String(u.gh).toLowerCase());
    $('memberLabel').textContent = online ? 'ONLINE — 2' : 'OFFLINE — 1';
    $('headCount').textContent = online ? 'online' : 'offline';
    const all = [{ gh: me.gh, name: me.name, avatar: me.avatar, you: true },
      { gh: u.gh, name: u.name || u.gh, avatar: u.avatar || '', offline: !online }];
    all.forEach(renderMemberRow);
    return;
  }
  const all = [{ gh: me.gh, name: me.name, avatar: me.avatar, you: true },
    ...[...peers.values()].sort((a, b) => a.gh.localeCompare(b.gh))];
  // same naam do baar nahi (ghost/duplicate tab)
  const seenGh = new Set();
  all.filter(u => {
    const low = String(u.gh).toLowerCase();
    if (seenGh.has(low)) return false;
    seenGh.add(low);
    return true;
  }).forEach(renderMemberRow);
  const shown = box.querySelectorAll('.mem').length;
  $('memberLabel').textContent = 'ONLINE — ' + shown;
  $('headCount').textContent = shown + ' online';
}
function renderMemberRow(u) {
  const box = $('memberList');
  const row = document.createElement('div');
  row.className = 'mem' + (u.you ? ' you' : '');
  if (u.offline) row.style.opacity = '.55';
  row.title = '@' + u.gh;
  row.onclick = () => openProfile(u.gh);
  const av = document.createElement('div'); av.className = 'av';
  const img = document.createElement('img');
  img.src = u.avatar || ghPng(u.gh);
  img.onerror = () => avatarFallback(img, u.gh);
  av.appendChild(img);
  if (!u.offline) {
    const st = document.createElement('div'); st.className = 'st';
    av.appendChild(st);
  }
  const tx = document.createElement('div');
  const nm = document.createElement('div'); nm.className = 'n'; nm.textContent = (u.name || u.gh) + (u.you ? ' (you)' : '') + (u.offline ? ' (offline)' : '');
  const un = document.createElement('div'); un.className = 'u'; un.textContent = '@' + u.gh;
  tx.append(nm, un);
  row.append(av, tx);
  box.appendChild(row);
}

window.toggleMenu = function (e) {
  if (e) e.stopPropagation();
  $('channels').classList.toggle('open');
};
document.querySelector('main').addEventListener('click', () => {
  $('channels').classList.remove('open');
});

window.copyInvite = function () {
  const url = new URL(location.href);
  url.searchParams.set('channel', channelId);
  const link = url.toString();
  if (navigator.clipboard) navigator.clipboard.writeText(link).then(() => sysMsg('Invite link copied!')).catch(() => sysMsg(link));
  else sysMsg(link);
};

window.leaveChat = function () {
  try { stopVoice(); } catch {}
  try { stopRing(); } catch {}
  convos.forEach(cv => {
    try { cv.room && cv.room.leave(); } catch {}
    if (cv.announceTimer) clearInterval(cv.announceTimer);
  });
  location.reload();
};
</script>
